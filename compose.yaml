services:
  reservas-bd:
    container_name: reservas-bd
    image: postgres:16
    environment:
      - POSTGRES_USER=${RESERVAS_DB_USER}
      - POSTGRES_PASSWORD=${RESERVAS_DB_PASSWORD}
      - POSTGRES_DB=${RESERVAS_DB_NAME}
    volumes:
      - reservas_datos:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - reservas_priv
    
  reservas-api:
    build: ./reservas
    container_name: reservas-api
    environment:
      - RESERVAS_DB_URL=postgresql+psycopg://${RESERVAS_DB_USER}:${RESERVAS_DB_PASSWORD}@reservas-bd:5432/${RESERVAS_DB_NAME}
      - RESERVAS_API_KEY=${RESERVAS_API_KEY}
      - HABITACIONES_GRPC_TARGET=habitaciones-grpc:50051
    ports:
      - "8000:80"
    depends_on:
      reservas-bd:
        condition: service_healthy
    networks:
      - reservas_priv
    
  # habitaciones

volumes:
  reservas_datos:

networks:
  reservas_priv:
  
  